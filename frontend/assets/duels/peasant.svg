<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none">
  <defs>
    <radialGradient id="peasant-aura" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ffa62b" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffa62b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peasant-cloth" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <linearGradient id="peasant-rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffa62b"/>
      <stop offset="0.55" stop-color="#ffa62b" stop-opacity="0"/>
    </linearGradient>
    <filter id="peasant-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="80" cy="80" rx="74" ry="76" fill="url(#peasant-aura)"/>
  <!-- shoulders -->
  <path d="M18 200 q6 -52 62 -60 q56 8 62 60 z" fill="url(#peasant-cloth)"/>
  <path d="M18 200 q6 -52 62 -60" stroke="url(#peasant-rim)" stroke-width="3" fill="none"/>
  <!-- head -->
  <path d="M80 46 q24 0 24 30 q0 30 -24 42 q-24 -12 -24 -42 q0 -30 24 -30 z"
        fill="#1a1f3a"/>
  <path d="M80 46 q-24 0 -24 30 q0 30 24 42" stroke="url(#peasant-rim)"
        stroke-width="2.5" fill="none"/>
  <!-- eyes: the one lit thing on every face, so a bust reads as a fighter -->
  <g filter="url(#peasant-glow)" fill="#ffa62b">
    <ellipse cx="71" cy="78" rx="4.5" ry="3"/>
    <ellipse cx="89" cy="78" rx="4.5" ry="3"/>
  </g>
  
  <g filter="url(#peasant-glow)">
    <path d="M28 52 q52 -22 104 0 q-52 14 -104 0 z" fill="#c4791a"/>
    <path d="M58 50 q22 -26 44 0 z" fill="#e0912a"/>
  </g>
  <path d="M132 198 L120 60" stroke="#c9924a" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#ffa62b" stroke-width="4" stroke-linecap="round" filter="url(#peasant-glow)">
    <path d="M108 74 L112 44 M120 60 L122 40 M132 70 L130 44"/>
    <path d="M107 72 L133 68"/>
  </g>
</svg>
