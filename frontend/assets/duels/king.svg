<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none">
  <defs>
    <radialGradient id="king-aura" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ffd21c" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffd21c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="king-cloth" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3a2f07"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <linearGradient id="king-rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffd21c"/>
      <stop offset="0.55" stop-color="#ffd21c" stop-opacity="0"/>
    </linearGradient>
    <filter id="king-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="80" cy="80" rx="74" ry="76" fill="url(#king-aura)"/>
  <!-- shoulders -->
  <path d="M18 200 q6 -52 62 -60 q56 8 62 60 z" fill="url(#king-cloth)"/>
  <path d="M18 200 q6 -52 62 -60" stroke="url(#king-rim)" stroke-width="3" fill="none"/>
  <!-- head -->
  <path d="M80 46 q24 0 24 30 q0 30 -24 42 q-24 -12 -24 -42 q0 -30 24 -30 z"
        fill="#1a1f3a"/>
  <path d="M80 46 q-24 0 -24 30 q0 30 24 42" stroke="url(#king-rim)"
        stroke-width="2.5" fill="none"/>
  <!-- eyes: the one lit thing on every face, so a bust reads as a fighter -->
  <g filter="url(#king-glow)" fill="#ffd21c">
    <ellipse cx="71" cy="78" rx="4.5" ry="3"/>
    <ellipse cx="89" cy="78" rx="4.5" ry="3"/>
  </g>
  
  <g filter="url(#king-glow)">
    <path d="M46 44 l8 -26 l14 16 l12 -22 l12 22 l14 -16 l8 26 z" fill="#ffd21c"/>
    <rect x="46" y="44" width="68" height="9" rx="3" fill="#e0a800"/>
    <circle cx="80" cy="16" r="4" fill="#fff3c4"/>
  </g>
  <path d="M40 152 q40 -18 80 0" stroke="#ffd21c" stroke-width="4" fill="none"
        opacity="0.75"/>
</svg>
