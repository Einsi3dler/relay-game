<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a3cf5">
  <title>Bullshit Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="/static/bullshit.css">
</head>
<body class="bs">

  <header class="bs-bar">
    <a class="bs-logo" href="/" aria-label="Back to all games">
      <span class="bs-logo__top">BULLSHIT</span>
      <span class="bs-logo__bottom">QUIZ</span>
    </a>
    <span class="bs-chip" id="me-chip">Hi, you</span>
  </header>

  <main class="bs-main">

    <!-- ------------------------------------------------------- write --- -->
    <section class="bs-stage" id="stage-write">
      <div class="bs-head">
        <h1 class="bs-title">Write a question</h1>
        <span class="bs-sticker" id="count-sticker">3 options</span>
      </div>
      <p class="bs-sub">It goes into tonight's bank. Make it a good one.</p>

      <div class="bs-card bs-card--question">
        <label class="bs-label" for="q-text">Your question</label>
        <textarea id="q-text" class="bs-question" rows="3" maxlength="140"
                  placeholder="What did Sam eat for breakfast every day in 2019?"></textarea>
        <span class="bs-count" id="q-count">0 / 140</span>
      </div>

      <p class="bs-hint">Fill in every option, then tap the tick on the real answer.</p>

      <ol class="bs-options" id="options"></ol>

      <button class="bs-btn bs-btn--go" id="submit" type="button" disabled>
        Put it in the bank
      </button>
      <p class="bs-missing" id="missing" aria-live="polite"></p>
    </section>

    <!-- -------------------------------------------------------- done --- -->
    <section class="bs-stage" id="stage-done" hidden>
      <div class="bs-burst" aria-hidden="true">
        <span>IN THE BANK!</span>
      </div>
      <h1 class="bs-title bs-title--center">Nice one.</h1>
      <p class="bs-sub bs-sub--center">You can still change it until the host starts the game.</p>

      <div class="bs-card bs-card--preview">
        <p class="bs-preview__q" id="preview-q"></p>
        <ol class="bs-preview__opts" id="preview-opts"></ol>
      </div>

      <div class="bs-card bs-card--meter">
        <div class="bs-meter__row">
          <span class="bs-label">Questions in</span>
          <span class="bs-meter__num" id="meter-num">0 of 0</span>
        </div>
        <div class="bs-meter" role="progressbar" aria-label="Questions submitted"
             aria-valuemin="0" id="meter">
          <span class="bs-meter__fill" id="meter-fill"></span>
        </div>
      </div>

      <button class="bs-btn bs-btn--ghost" id="edit" type="button">Change my question</button>
    </section>

  </main>

  <script src="/static/bullshit.js"></script>
</body>
</html>
