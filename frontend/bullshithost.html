<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a3cf5">
  <meta name="robots" content="noindex, nofollow">
  <title>Bullshit Quiz host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="/static/toon.css">
  <link rel="stylesheet" href="/static/bullshit.css">
</head>
<body class="bs bs--host">

  <header class="bs-bar">
    <a class="bs-logo" href="/" aria-label="Back to all games">
      <span class="bs-logo__top">BULLSHIT</span>
      <span class="bs-logo__bottom">QUIZ</span>
    </a>
    <span class="bs-chip">Host</span>
  </header>

  <main class="bs-main" id="host">
    <p class="bs-sub bs-sub--center">Opening the room...</p>
  </main>

  <div class="bs-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/bullshit-common.js"></script>
  <script src="/static/bullshithost.js"></script>
</body>
</html>
